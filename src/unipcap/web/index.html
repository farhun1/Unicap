<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniPCAP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📡</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
    <h1>UniPCAP</h1>
  </div>
  <div class="bar-actions">
    <button id="open" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      Open capture
    </button>
    <input id="picker" type="file" accept=".pcap,.pcapng,.cap,.gz" hidden>
    <span id="status" role="status"></span>
  </div>
</header>
<div id="dropzone" class="dropzone" hidden>
  <div class="dropzone-inner">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <p>Drop your capture file here</p>
    <span>.pcap · .pcapng · .cap · .gz</span>
  </div>
</div>
<main>
  <div id="banners"></div>
  <div id="file" class="file" hidden></div>
  <div id="chips" class="chips"></div>
  <div id="ladder" class="ladder" hidden></div>
  <div id="sections"></div>
  <p id="empty" class="empty">Open a capture (.pcap, .pcapng, .cap, .gz) to see every node grouped by role.</p>
</main>
<script src="app.js"></script>
</body>
</html>
