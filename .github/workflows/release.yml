name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The capture guard (tests/test_user_data_guard.py) scans the whole history;
          # a shallow clone would only see the single triggering commit.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Version from pyproject
        id: version
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Install Wireshark (the tests need a real tshark)
        run: choco install wireshark -y --no-progress

      - name: Test
        run: uv run python -m pytest -q

      - name: Build portable zip
        run: pwsh scripts/build.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Smoke test the portable build
        run: pwsh scripts/smoke.ps1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $tag = "v$v-r$env:GITHUB_RUN_NUMBER"   # unique per run; re-runs replace the asset
          $zip = "dist/unipcap-$v-win64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title $tag --generate-notes
          }
